name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Public platform contracts
        run: npm run contracts

      - name: Grandfathered publication baseline
        env:
          PUBLICATION_GATE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run publication:baseline -- --base-sha "$PUBLICATION_GATE_BASE_SHA"

      - name: App workspace typecheck
        run: npm run typecheck --workspace @min-egenkontroll/app

      - name: Web workspace typecheck
        run: npm run typecheck --workspace @min-egenkontroll/web

      - name: App workspace lint
        run: npm run lint --workspace @min-egenkontroll/app

      - name: Web workspace lint
        run: npm run lint --workspace @min-egenkontroll/web

      - name: Repository lint
        run: npm run lint

      - name: App workspace build
        run: npm run build --workspace @min-egenkontroll/app

      - name: Web workspace build
        run: npm run build --workspace @min-egenkontroll/web
